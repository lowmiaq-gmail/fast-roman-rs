name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x86_64, os: ubuntu-22.04}
          - {label: macos-arm64, os: macos-15}
          - {label: windows-x86_64, os: windows-2022}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install tools
        run: python -m pip install --upgrade pip "maturin==1.11.5" "pytest>=8,<10"
      - name: Rust gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Build and install packaged native wheel
        run: |
          maturin build --release --locked --out dist
          python -c "import glob,subprocess,sys; w=glob.glob('dist/*.whl'); assert len(w)==1,w; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',w[0]])"
          python -c "import importlib.util,roman; n=importlib.util.find_spec('roman._native'); assert n and n.origin.endswith(('.so','.pyd')); assert roman.toRoman(972)=='CMLXXII'"
      - name: Candidate and complete upstream suites
        shell: bash
        run: |
          python -m pytest -q tests
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          PYTHON=python CANDIDATE_EXPECTED_ROOT="$candidate_root" bash scripts/run_upstream_full.sh
      - name: Isolated 10,000-case differential
        shell: bash
        run: |
          python -m venv oracle-venv
          oracle_python=oracle-venv/bin/python
          if [ ! -x "$oracle_python" ]; then oracle_python=oracle-venv/Scripts/python; fi
          python scripts/run_differential.py --oracle-python "$oracle_python" --candidate-python "$(python -c 'import sys; print(sys.executable)')"

  fallback-wheel:
    name: Build canonical universal fallback
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build fallback
        run: |
          python -m pip install "setuptools>=77" wheel build
          python scripts/build_fallback_wheel.py --out-dir dist
          python -c "import glob,zipfile; w=glob.glob('dist/*-py3-none-any.whl'); assert len(w)==1,w; z=zipfile.ZipFile(w[0]); m=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))); assert b'Dynamic:' not in m"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-universal-fallback-wheel
          path: dist/*-py3-none-any.whl
          if-no-files-found: error

  fallback-pypy:
    name: Fallback / PyPy 3.10
    needs: fallback-wheel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "pypy3.10"
      - uses: actions/download-artifact@v8
        with:
          name: ci-universal-fallback-wheel
          path: dist
      - name: Install and verify prebuilt fallback
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pip install --force-reinstall --no-deps dist/*-py3-none-any.whl
          python -c "import roman; assert roman.__file__.endswith('.py'); assert roman.toRoman(972)=='CMLXXII'"
          python -m pytest -q tests
      - name: Complete upstream and differential
        shell: bash
        run: |
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          PYTHON=python CANDIDATE_EXPECTED_ROOT="$candidate_root" bash scripts/run_upstream_full.sh
          python -m venv oracle-venv
          python scripts/run_differential.py --oracle-python oracle-venv/bin/python --candidate-python "$(python -c 'import sys; print(sys.executable)')"
