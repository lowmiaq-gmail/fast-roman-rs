[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fast-roman-rs"
version = "0.1.0"
description = "Fast Rust-backed drop-in replacement for roman 5.2"
readme = "README.md"
requires-python = ">=3.10"
license = "ZPL-2.1"
license-files = ["LICENSE.txt", "COPYRIGHT.txt"]
authors = [{ name = "fast-roman-rs contributors" }]
dependencies = []
keywords = ["roman", "roman-numerals", "conversion", "pyo3", "rust", "drop-in-replacement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
roman = "roman:main"

[project.urls]
Homepage = "https://github.com/lowmiaq-gmail/fast-roman-rs"
Repository = "https://github.com/lowmiaq-gmail/fast-roman-rs"
Issues = "https://github.com/lowmiaq-gmail/fast-roman-rs/issues"
Changelog = "https://github.com/lowmiaq-gmail/fast-roman-rs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.maturin]
bindings = "pyo3"
module-name = "roman._native"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = ["fallback/build/**", "fallback/*.egg-info/**"]
include = [
  { path = "fallback/roman/**", format = "sdist" },
  { path = "tests/**", format = "sdist" },
  { path = "upstream/**", format = "sdist" },
]

[tool.maturin.sbom]
rust = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
